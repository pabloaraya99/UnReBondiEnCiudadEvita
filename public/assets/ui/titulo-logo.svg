<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <linearGradient id="verde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CC96B"/>
      <stop offset="1" stop-color="#2E8B3A"/>
    </linearGradient>
    <linearGradient id="amarillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD966"/>
      <stop offset="1" stop-color="#F2A81C"/>
    </linearGradient>
    <linearGradient id="nubeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdf8"/>
      <stop offset="1" stop-color="#cfd4cc"/>
    </linearGradient>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/>
    </filter>
    <path id="estrella4" d="M0 -14 L3.5 -3.5 L14 0 L3.5 3.5 L0 14 L-3.5 3.5 L-14 0 L-3.5 -3.5 Z"/>
    <path id="burst" d="M0 -46 L10 -20 L34 -32 L24 -8 L48 -6 L28 8 L44 26 L18 22 L16 46 L0 26 L-16 46 L-18 22 L-44 26 L-28 8 L-48 -6 L-24 -8 L-34 -32 L-10 -20 Z"/>
  </defs>

  <!-- ============ TEXTO ARRIBA: UN RE BONDI (grafiti gangster) ============ -->
  <!-- sombra magenta desplazada -->
  <text x="462" y="118" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif"
        font-size="96" font-weight="900" letter-spacing="5"
        fill="#E5449D" filter="url(#rough)">UN RE BONDI</text>
  <!-- contorno NEGRO grueso + relleno verde -->
  <text x="452" y="108" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif"
        font-size="96" font-weight="900" letter-spacing="5"
        fill="url(#verde)" stroke="#14161a" stroke-width="16" stroke-linejoin="round"
        paint-order="stroke" filter="url(#rough)">UN RE BONDI</text>
  <!-- brillo superior -->
  <text x="452" y="108" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif"
        font-size="96" font-weight="900" letter-spacing="5"
        fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35">UN RE BONDI</text>

  <!-- ============ NUBE DE PELEA (centro) ============ -->
  <g transform="translate(450,320)">
    <!-- estelas de movimiento alrededor -->
    <g stroke="#14161a" stroke-width="7" stroke-linecap="round" opacity="0.9">
      <path d="M-215 -60 l-34 -14"/>
      <path d="M-208 30 l-40 8"/>
      <path d="M210 -70 l36 -18"/>
      <path d="M222 20 l42 6"/>
      <path d="M-60 -150 l-12 -32"/>
      <path d="M70 -148 l14 -30"/>
    </g>

    <!-- la nube: bultos clásicos de pelea de dibujos -->
    <g fill="url(#nubeGrad)" stroke="#14161a" stroke-width="8">
      <circle cx="-95" cy="10" r="58"/>
      <circle cx="-45" cy="-52" r="62"/>
      <circle cx="30" cy="-58" r="58"/>
      <circle cx="95" cy="-18" r="62"/>
      <circle cx="80" cy="48" r="55"/>
      <circle cx="0" cy="55" r="62"/>
      <circle cx="-70" cy="48" r="52"/>
    </g>

    <!-- guante rojo volando arriba-izquierda -->
    <g transform="translate(-128,-118) rotate(-28)">
      <ellipse cx="0" cy="0" rx="36" ry="29" fill="#d8352a" stroke="#14161a" stroke-width="7"/>
      <ellipse cx="-24" cy="9" rx="15" ry="13" fill="#d8352a" stroke="#14161a" stroke-width="6"/>
      <rect x="20" y="-15" width="24" height="32" rx="9" fill="#f4f1e8" stroke="#14161a" stroke-width="6"/>
      <path d="M42 -10 l26 -8 M44 2 l28 -2" stroke="#14161a" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- guante rojo volando derecha -->
    <g transform="translate(140,-70) rotate(24) scale(-1,1)">
      <ellipse cx="0" cy="0" rx="36" ry="29" fill="#d8352a" stroke="#14161a" stroke-width="7"/>
      <ellipse cx="-24" cy="9" rx="15" ry="13" fill="#d8352a" stroke="#14161a" stroke-width="6"/>
      <rect x="20" y="-15" width="24" height="32" rx="9" fill="#f4f1e8" stroke="#14161a" stroke-width="6"/>
      <path d="M42 -10 l26 -8 M44 2 l28 -2" stroke="#14161a" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- guante rojo abajo-izquierda -->
    <g transform="translate(-150,66) rotate(14)">
      <ellipse cx="0" cy="0" rx="30" ry="24" fill="#d8352a" stroke="#14161a" stroke-width="7"/>
      <ellipse cx="-20" cy="8" rx="12" ry="11" fill="#d8352a" stroke="#14161a" stroke-width="6"/>
      <rect x="17" y="-13" width="20" height="27" rx="8" fill="#f4f1e8" stroke="#14161a" stroke-width="6"/>
    </g>

    <!-- puño saliendo de arriba de la nube -->
    <g transform="translate(6,-142) rotate(-8)">
      <ellipse cx="0" cy="0" rx="32" ry="26" fill="#d8352a" stroke="#14161a" stroke-width="7"/>
      <rect x="-18" y="-40" width="36" height="22" rx="9" fill="#d8352a" stroke="#14161a" stroke-width="6"/>
      <rect x="16" y="-16" width="22" height="30" rx="9" fill="#f4f1e8" stroke="#14161a" stroke-width="6"/>
    </g>

    <!-- ¡POW! starburst -->
    <g transform="translate(150,108) rotate(12)">
      <use href="#burst" fill="#F2C94C" stroke="#14161a" stroke-width="6"/>
      <text y="10" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif"
            font-size="30" font-weight="900" fill="#d8352a" stroke="#14161a" stroke-width="1.2">¡POW!</text>
    </g>

    <!-- ¡PIÑA! starburst -->
    <g transform="translate(-60,130) rotate(-10) scale(0.8)">
      <use href="#burst" fill="#2DD4BF" stroke="#14161a" stroke-width="6"/>
      <text y="10" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif"
            font-size="30" font-weight="900" fill="#14161a">¡PIÑA!</text>
    </g>

    <!-- estrellitas -->
    <use href="#estrella4" transform="translate(-190,-96) scale(1.3)" fill="#F2C94C" stroke="#14161a" stroke-width="2.5"/>
    <use href="#estrella4" transform="translate(196,-24) scale(1.1)" fill="#F2C94C" stroke="#14161a" stroke-width="2.5"/>
    <use href="#estrella4" transform="translate(-26,-186) scale(0.9)" fill="#F2C94C" stroke="#14161a" stroke-width="2.5"/>
    <use href="#estrella4" transform="translate(96,116) scale(0.8)" fill="#F2C94C" stroke="#14161a" stroke-width="2.5"/>
    <use href="#estrella4" transform="translate(-116,140) scale(0.7)" fill="#F2C94C" stroke="#14161a" stroke-width="2.5"/>
  </g>

  <!-- ============ TEXTO ABAJO: EN CIUDAD EVITA ============ -->
  <text x="458" y="528" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif"
        font-size="56" font-weight="900" letter-spacing="9"
        fill="#E5449D" filter="url(#rough)">EN CIUDAD EVITA</text>
  <text x="452" y="522" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif"
        font-size="56" font-weight="900" letter-spacing="9"
        fill="url(#amarillo)" stroke="#14161a" stroke-width="12" stroke-linejoin="round"
        paint-order="stroke" filter="url(#rough)">EN CIUDAD EVITA</text>
</svg>
