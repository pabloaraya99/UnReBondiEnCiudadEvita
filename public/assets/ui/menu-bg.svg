<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d9be9"/>
      <stop offset="0.55" stop-color="#7ec8f7"/>
      <stop offset="1" stop-color="#d9f0ff"/>
    </linearGradient>
    <pattern id="brick" width="84" height="42" patternUnits="userSpaceOnUse">
      <rect width="84" height="42" fill="#9c5f4a"/>
      <path d="M0 0h84M0 21h84M0 42h84" stroke="#7a4536" stroke-width="3"/>
      <path d="M21 0v21M63 0v21M0 21v21M42 21v21M84 21v21" stroke="#7a4536" stroke-width="3"/>
    </pattern>
    <linearGradient id="wallshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <!-- cielo -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- nubes -->
  <g fill="#ffffff" opacity="0.95">
    <g transform="translate(180,120)"><ellipse rx="70" ry="26"/><ellipse cx="55" cy="-12" rx="52" ry="24"/><ellipse cx="-52" cy="-8" rx="46" ry="20"/></g>
    <g transform="translate(640,80) scale(0.8)"><ellipse rx="70" ry="26"/><ellipse cx="55" cy="-12" rx="52" ry="24"/><ellipse cx="-52" cy="-8" rx="46" ry="20"/></g>
    <g transform="translate(1120,150) scale(1.1)"><ellipse rx="70" ry="26"/><ellipse cx="55" cy="-12" rx="52" ry="24"/><ellipse cx="-52" cy="-8" rx="46" ry="20"/></g>
    <g transform="translate(1450,90) scale(0.7)"><ellipse rx="70" ry="26"/><ellipse cx="55" cy="-12" rx="52" ry="24"/><ellipse cx="-52" cy="-8" rx="46" ry="20"/></g>
    <g transform="translate(880,220) scale(0.6)" opacity="0.8"><ellipse rx="70" ry="26"/><ellipse cx="55" cy="-12" rx="52" ry="24"/><ellipse cx="-52" cy="-8" rx="46" ry="20"/></g>
  </g>

  <!-- pasto al pie de la pared -->
  <rect y="800" width="1600" height="100" fill="#58c24e"/>
  <rect y="800" width="1600" height="16" fill="#4ab044"/>

  <!-- paredón de ladrillo -->
  <rect y="540" width="1600" height="280" fill="url(#brick)"/>
  <rect y="540" width="1600" height="280" fill="url(#wallshade)"/>
  <!-- filo superior de la pared -->
  <rect y="532" width="1600" height="14" fill="#7a4536"/>

  <!-- grietas -->
  <g stroke="#5d3229" stroke-width="3" fill="none" opacity="0.7">
    <path d="M300 540 l20 60 l-14 44 l22 50"/>
    <path d="M1240 540 l-18 50 l16 40 l-20 56"/>
  </g>

  <!-- grafitis en la pared -->
  <!-- tag magenta -->
  <g transform="translate(210,640)" opacity="0.9">
    <path d="M0 60 q30 -70 60 -20 q25 40 60 -10 q20 -30 45 -5" fill="none" stroke="#E5449D" stroke-width="14" stroke-linecap="round"/>
    <path d="M0 60 q30 -70 60 -20 q25 40 60 -10 q20 -30 45 -5" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- tag turquesa -->
  <g transform="translate(1180,660)">
    <path d="M0 40 q20 -50 50 -30 q30 20 55 -15" fill="none" stroke="#2DD4BF" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <circle cx="10" cy="10" r="8" fill="#2DD4BF"/>
    <circle cx="70" cy="50" r="6" fill="#2DD4BF"/>
  </g>
  <!-- tag amarillo -->
  <g transform="translate(700,690)">
    <path d="M0 30 l30 -45 l15 40 l30 -50 l20 55" fill="none" stroke="#F2C94C" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>
  <!-- hoja weed estilizada -->
  <g transform="translate(470,610) scale(1.1)">
    <path d="M40 0 q-6 40 -30 60 q36 -8 30 -60z M40 0 q6 40 30 60 q-36 -8 -30 -60z M40 5 q0 45 0 65 q-8 -20 0 -65z" fill="#3FA34D"/>
    <path d="M40 0 q-18 28 -34 38 q26 2 34 -38z M40 0 q18 28 34 38 q-26 2 -34 -38z" fill="#2E8B3A"/>
  </g>
  <!-- texto grafiti EVITA en la pared -->
  <text x="960" y="700" font-family="'Arial Black', Impact, sans-serif" font-size="64" font-weight="900"
        fill="#1E5B2E" stroke="#F2C94C" stroke-width="2.5" letter-spacing="6" opacity="0.85"
        transform="rotate(-2 960 700)">EVITA</text>

  <!-- arbustos a los costados -->
  <g>
    <g transform="translate(40,780)"><circle r="55" fill="#2E8B3A"/><circle cx="50" cy="18" r="45" fill="#3FA34D"/><circle cx="-42" cy="22" r="40" fill="#58c24e"/><circle cx="12" cy="-18" r="38" fill="#49a83f"/></g>
    <g transform="translate(1560,790)"><circle r="60" fill="#2E8B3A"/><circle cx="-55" cy="15" r="48" fill="#3FA34D"/><circle cx="45" cy="24" r="42" fill="#58c24e"/><circle cx="-8" cy="-20" r="36" fill="#49a83f"/></g>
    <g transform="translate(260,830) scale(0.7)"><circle r="50" fill="#3FA34D"/><circle cx="45" cy="14" r="40" fill="#58c24e"/></g>
    <g transform="translate(1330,835) scale(0.65)"><circle r="50" fill="#3FA34D"/><circle cx="-45" cy="14" r="40" fill="#58c24e"/></g>
  </g>

  <!-- sombra de suelo suave -->
  <ellipse cx="800" cy="870" rx="700" ry="40" fill="#000000" opacity="0.10"/>
</svg>
